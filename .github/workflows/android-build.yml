name: Android build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test and build with a public placeholder
        run: ./gradlew testDebugUnitTest assembleDebug -PplaylistUrl=https://example.com/playlist.m3u
