name: Source manager tests
on:
  push:
    branches: [main]
    paths:
      - source-manager/**
      - .github/workflows/source-manager-tests.yml
  pull_request:
    paths:
      - source-manager/**
      - .github/workflows/source-manager-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source-manager
    env:
      QT_QPA_PLATFORM: offscreen
      PIPENV_VENV_IN_PROJECT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pipenv
          cache-dependency-path: source-manager/Pipfile.lock
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 ffmpeg
      - name: Install locked dependencies
        run: |
          python -m pip install pipenv
          pipenv sync --dev
          pipenv verify
      - name: Run complete test suite
        run: pipenv run python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: pipenv run python -m compileall -q manager main.py service updates utils tests
