services:
  source-manager:
    build:
      context: .
      dockerfile: Dockerfile.manager
    image: tv-suite/source-manager:local
    container_name: tv-source-manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./private/data:/data
    environment:
      TZ: Asia/Shanghai
    cpus: 1
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
